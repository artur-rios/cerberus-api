# What Jenkins checks for this repository, read by the pipeline of the yggdrasil installation that runs it (yggdrasil's
# docs/catalog.md, "Repository pipeline file", has every field). It is data, never code: images (pinned by version and
# digest, which Renovate keeps up to date: the owner merges those changes), commands, globs and the names of Jenkins
# credentials. The commands are scripts under ci/ that run from the repository's root, so you can run them on your own
# machine too. Nothing is released from here yet: the catalog entry has checks only.
#
# Check it where the catalog is, in the yggdrasil checkout:
#   python3 scripts/pipeline_config.py describe cerberus-api <this repository's checkout>

checks:
  test:                                  # specifications, protocol harness, vulnerability scan, build, OpenAPI contract, tests, coverage (ci/test.sh)
    image: mcr.microsoft.com/dotnet/sdk:10.0.402@sha256:747cbade5bfd918a175ac32f8f1d931edec2c7d0d5397a3de72eaef1ac1f66d2
    run: ci/test.sh
    docker: true                         # the functional suite starts PostgreSQL through Testcontainers
    credentials:
      # ReportGenerator's PRO license. Not bound on renovate/* builds, nor when missing: the free report is made.
      REPORTGENERATOR_LICENSE: reportgenerator-license
    # The coverage report, and the .trx results of every test project.
    archive: "docs/coverage-report/**,**/TestResults/*.trx"
  docker:                                # the API's container image can still be built (ci/docker.sh)
    image: docker:29.9.3-cli@sha256:2357639ad1ea7d0194134bf3292622fd4e562483966ed674e5d7c945b5f3b28d
    run: ci/docker.sh
    docker: true                         # the CI engine's socket: the image is built by it

# What the old Tests workflow checked for pull requests into main besides the code: the protocol review gate.
branchPolicy:
  image: python:3.14.9-alpine@sha256:dbeb11d16bb95c3a7e3c25c842cb9f20cbc8c18f8be0461a4a0dcc861ad386a0
  run: sh ci/branch-policy.sh
